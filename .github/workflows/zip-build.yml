name: Build APK from ZIP
on:
  push:
    paths:
      - 'EchoMic.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir work
          unzip -q EchoMic.zip -d work
          D=$(dirname "$(find work -name settings.gradle | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build APK
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" EchoMic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EchoMic-apk
          path: EchoMic.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: EchoMic v${{ github.run_number }}
          files: EchoMic.apk
